[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
rust-version = "1.89"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/talaagent/grabcli"
homepage = "https://github.com/talaagent/grabcli"
readme = "README.md"
keywords = ["grab", "grabfood", "cli", "food-delivery", "philippines"]
categories = ["command-line-utilities"]
authors = ["Ian Macalinao <me@ianm.com>"]

[workspace.dependencies]
grabcli-core = { path = "crates/grabcli-core", version = "0.2.0" }
grabfood = { path = "crates/grabfood", version = "0.2.0" }
grabmart = { path = "crates/grabmart", version = "0.2.0" }
grabcli-sqlite = { path = "crates/grabcli-sqlite", version = "0.2.0" }
grabcli-service = { path = "crates/grabcli-service", version = "0.2.0" }
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bpaf = { version = "0.9.28", features = ["derive"] }
dirs = "7.0.0"
ab_glyph = "0.2.32"
getrandom = "0.4.3"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
aws-lc-rs = "1.19.0"
rustls-pki-types = "1.15.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.27.0", default-features = false, features = ["text"] }
# Matches the feature set tala-agent builds reqwest 0.13 with (rustls on
# aws-lc-rs, query) so a dependent workspace unifies on one reqwest.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.30.0"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
urlencoding = "2.1.3"

[workspace.lints.clippy]
unwrap_used = "deny"

[package]
name = "grabcli-core"
description = "Shared Grab session, auth, hydra and HTTP plumbing for grabcli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
futures-util.workspace = true
getrandom.workspace = true
image.workspace = true
reqwest.workspace = true
rsa = { workspace = true, optional = true }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
urlencoding.workspace = true

[features]
default = []
# Native hydra minting (`hydra::mint_native`, `hydra_mode = "native"`): signs
# the hydra JWT locally with an RS256 key, which pulls in rsa and its PKCS
# stack. Without it hydra is minted over CDP only. The `grab` binary turns
# it on.
native-hydra = ["dep:rsa"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

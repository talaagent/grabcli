[package]
rust-version = { workspace = true }
name = "grabmart"
description = "GrabMart API and CLI subcommands for grabcli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/grabmart"
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[dependencies]
grabcli-core.workspace = true
grabfood.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
urlencoding.workspace = true

[features]
default = []
# Native hydra minting; see grabcli-core's `native-hydra`.
native-hydra = ["grabcli-core/native-hydra", "grabfood/native-hydra"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

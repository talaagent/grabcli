# Self-contained (no workspace inheritance) so the crate builds when a git
# dependency vendors only this directory (e.g. crate2nix). Keep the versions
# in step with the root Cargo.toml's [workspace.dependencies].
[package]
rust-version = "1.89"
name = "grabfood"
description = "GrabFood typed API for grabcli"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/talaagent/grabcli"
homepage = "https://github.com/talaagent/grabcli"
readme = "README.md"
documentation = "https://docs.rs/grabfood"
keywords = ["grab", "grabfood", "cli", "food-delivery", "philippines"]
categories = ["command-line-utilities"]
authors = ["Ian Macalinao <me@ianm.com>"]

[dependencies]
grabcli-core = { path = "../grabcli-core", version = "0.2.0" }
bpaf = { version = "0.9.28", features = ["derive"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
urlencoding = "2.1.3"

[features]
default = []
# The bpaf parser for `ListOpts` (used by the `grab` CLI).
cli = ["dep:bpaf"]
# Native hydra minting; see grabcli-core's `native-hydra`.
native-hydra = ["grabcli-core/native-hydra"]

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
unwrap_used = "deny"

[package.metadata.docs.rs]
all-features = true

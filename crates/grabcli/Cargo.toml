[package]
rust-version = { workspace = true }
name = "grabcli"
description = "Command-line client for Grab services (GrabFood first)"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/grabcli"
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[[bin]]
name = "grab"
path = "src/main.rs"

[dependencies]
grabcli-core = { workspace = true, features = ["native-hydra"] }
grabcli-sqlite.workspace = true
grabfood = { workspace = true, features = ["cli", "native-hydra"] }
grabmart = { workspace = true, features = ["native-hydra"] }
async-trait.workspace = true
bpaf.workspace = true
serde_json.workspace = true
tokio.workspace = true
image.workspace = true
imageproc.workspace = true
ab_glyph.workspace = true
reqwest.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

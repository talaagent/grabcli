# cargo-deny: `cargo deny check` (CI's `deny` job).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
# Every RustSec advisory fails the check, unmaintained and unsound included;
# add an `ignore` entry (with a reason) only after reading the advisory.
unmaintained = "all"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "Latest ab_glyph/imageproc still use ttf-parser; no maintained drop-in upgrade available" },
]

[licenses]
version = 2
# Permissive licenses only. Anything not listed fails the check, so every
# copyleft license (GPL, LGPL, AGPL, MPL, EPL, ...) does. Add a license here
# only if it is permissive.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9
# The list is the policy, not an inventory: no warning for an allowed
# license no dependency uses (yet).
unused-allowed-license = "allow"
exceptions = [{ crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] }]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false
highlight = "all"
deny = [{ name = "chrono", reason = "Use jiff for date/time handling" }]
skip = []
skip-tree = []

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

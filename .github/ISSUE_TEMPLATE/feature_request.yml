name: Feature request
description: Suggest an API, workflow, or documentation improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What are you trying to do, and where does the current behavior fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example call or command, and any alternatives you considered.
    validations:
      required: true

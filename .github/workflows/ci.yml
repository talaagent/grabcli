name: CI

on:
  push:
    branches: [master]
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: nix-community
          skipPush: true

      # Formatting, git hooks and the package build (which runs the tests).
      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: nix build
        run: nix build .#grab --print-build-logs

      - name: cargo clippy
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo nextest
        run: nix develop --command cargo nextest run --profile ci --workspace --all-features --locked

      - name: Rustdoc examples
        run: nix develop --command cargo test --workspace --doc --locked

      - name: cargo fmt
        run: nix develop --command cargo fmt --all --check

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: nix develop --command cargo doc --workspace --all-features --no-deps --locked

      # Builds each crate alone from its packaged tarball, default features.
      - name: cargo publish --dry-run
        run: nix develop --command cargo publish --workspace --dry-run --locked

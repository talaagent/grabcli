# Releases with release-plz (release-plz.toml): a release PR on each push to
# master, and crates.io publishing of any version crates.io doesn't have yet.
#
# Publishing uses crates.io trusted publishing (OIDC): the release job, in
# the `release` environment, trades a GitHub OIDC token for a short-lived
# crates.io token (rust-lang/crates-io-auth-action). There is no registry
# token secret. Each crate's trusted publisher on crates.io is: owner
# `talaagent`, repository `grabcli`, workflow `release-plz.yml`, environment
# `release`. Trusted publishing only works for a crate that already exists,
# so each crate's first publish is a manual `cargo publish`.
#
# The release PR needs the organization and repository to allow GitHub
# Actions to create pull requests; until then set no RELEASE_PR variable
# and the job is skipped. Once allowed: `gh variable set RELEASE_PR --body
# true`.

name: Release-plz

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'talaagent' }}
    environment: release
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    # One publish at a time; never cancel one halfway through.
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # Fail visibly when registry/bootstrap setup is incomplete.
      - name: Versions not on crates.io yet
        id: pending
        run: |
          ua="User-Agent: ${GITHUB_REPOSITORY} release workflow"
          api=https://crates.io/api/v1/crates
          pending=""
          missing=false
          metadata=$(cargo metadata --no-deps --format-version 1)
          while read -r name version; do
            crate_code=$(curl --silent --show-error --retry 3 -o /dev/null -w '%{http_code}' -H "$ua" "$api/$name")
            case "$crate_code" in
              200) ;;
              404)
                echo "::error::$name has never been published. Run cargo publish -p $name with registry credentials, then configure its crates.io trusted publisher. See CONTRIBUTING.md."
                echo "- $name: initial publication required; see CONTRIBUTING.md." >> "$GITHUB_STEP_SUMMARY"
                missing=true
                continue
                ;;
              *) echo "::error::crates.io lookup for $name returned HTTP $crate_code"; exit 1 ;;
            esac
            code=$(curl --silent --show-error --retry 3 -o /dev/null -w '%{http_code}' -H "$ua" "$api/$name/$version")
            echo "$name $version: crates.io $code"
            case "$code" in
              200) echo "- $name@$version is already published." >> "$GITHUB_STEP_SUMMARY" ;;
              404) pending="$pending $name@$version" ;;
              *) echo "::error::crates.io lookup for $name@$version returned HTTP $code"; exit 1 ;;
            esac
          done < <(jq -r '.packages[] | select(.publish != []) | "\(.name) \(.version)"' <<< "$metadata")
          if [ "$missing" = true ]; then exit 1; fi
          echo "pending=${pending# }" >> "$GITHUB_OUTPUT"
          if [ -z "$pending" ]; then
            echo "::notice::All workspace versions are already on crates.io."
          fi
      - name: crates.io token (trusted publishing)
        if: ${{ steps.pending.outputs.pending != '' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      # Publishes in dependency order the versions crates.io doesn't have
      # yet (after a release PR is merged) and tags them.
      - name: Run release-plz
        if: ${{ steps.pending.outputs.pending != '' && steps.auth.outcome == 'success' }}
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Opens/updates the release PR. PRs created with GITHUB_TOKEN don't trigger CI.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'talaagent' && vars.RELEASE_PR == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-rust
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
